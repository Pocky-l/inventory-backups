plugins {
    id 'multiloader-loader'
    id 'idea'
    id 'net.neoforged.moddev.legacyforge'
}

sourceSets.main.resources {
    srcDir('src/generated/resources')
    exclude('src/generated/**/.cache')
}

legacyForge {
    version = "${minecraft_version}-${forge_version}"

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    runs {
        client {
            client()
            systemProperty 'forge.enabledGameTestNamespaces', project.mod_id
        }

        server {
            server()
            // Separate directory, so a dedicated server can run next to the dev client.
            gameDirectory = project.file('run-server')
            programArgument '--nogui'
            systemProperty 'forge.enabledGameTestNamespaces', project.mod_id
        }

        gameTestServer {
            type = 'gameTestServer'
            // Own directory: in run/ it would test inside the dev client's world instead of a fresh flat one.
            gameDirectory = project.file('run/gametest')
            systemProperty 'forge.enabledGameTestNamespaces', project.mod_id
        }

        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.INFO
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

// Dependencies added to localRuntime are available in dev runs but are not published as dependencies.
configurations {
    runtimeClasspath.extendsFrom localRuntime
}

// Forge 1.20.1 runs the game tests on a dedicated server, in a world made from server.properties: a flat one, so the
// tests do not meet hills, oceans and caves around their small areas.
var prepareGameTestServer = tasks.register('prepareGameTestServer') {
    var dir = project.file('run/gametest')
    outputs.file(new File(dir, 'server.properties'))
    doLast {
        dir.mkdirs()
        new File(dir, 'server.properties').text = [
                'level-type=minecraft:flat', 'generate-structures=false', 'spawn-protection=0'
        ].join(System.lineSeparator()) + System.lineSeparator()
    }
}
tasks.named('runGameTestServer') { dependsOn prepareGameTestServer }

var generateModMetadata = tasks.register('generateModMetadata', ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            forge_version          : forge_version,
            forge_version_range    : forge_version_range,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description,
            mod_url                : mod_url,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from 'src/main/templates'
    into 'build/generated/sources/modMetadata'
}
sourceSets.main.resources.srcDir generateModMetadata
legacyForge.ideSyncTask generateModMetadata

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}

publishMods {
    // The reobfuscated (SRG) jar is the one that runs outside the development environment.
    file = tasks.named('reobfJar').flatMap { it.archiveFile }
    displayName = "${mod_name} ${mod_version}+${minecraft_version} (Forge)"
    modLoaders.add('forge')

    curseforge {
        curseforge_requires.split(',')*.trim().findAll().each { requires(it) }
        curseforge_optional.split(',')*.trim().findAll().each { optional(it) }
    }
}
