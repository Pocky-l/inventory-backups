org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

## Environment
minecraft_version=26.1.2
minecraft_version_range=[26.1.2]
neo_version=26.1.2.114
# The plain Minecraft the common project compiles against (https://projects.neoforged.net/neoforged/neoform).
neo_form_version=26.1.2-1
loader_version_range=[1,)
# Fabric: the versions to build with; the *_min_version ones are what fabric.mod.json asks of players (Forge Config
# API Port 26.1.5 needs Fabric Loader 0.19.0 and Fabric API 0.149.0 itself).
fabric_loader_version=0.20.1
fabric_loader_min_version=0.19.0
fabric_api_version=0.155.3+26.1.2
fabric_api_min_version=0.149.0
# Forge's config API on Fabric (https://www.curseforge.com/minecraft/mc-mods/forge-config-api-port); its NeoForge
# API lets common compile Config against plain Minecraft.
forge_config_api_port_version=26.1.5
# Permission nodes on Fabric (LuckPerms and other permission mods implement it); bundled in the Fabric jar.
fabric_permissions_api_version=0.7.0

## Mod
mod_id=inventorybackups
mod_name=Inventory Backups
mod_version=3.2.0
mod_group_id=com.pockyl.inventorybackups
mod_license=MIT
mod_authors=Pocky
mod_description=Records every inventory and ender chest change, with item search, transfer trails, retention and an optional timeline screen for admins.
mod_url=https://github.com/Pocky-l/inventory-backups

## CurseForge
# Numeric project ID from the CurseForge project page ("About Project" sidebar).
curseforge_project_id=836385
curseforge_client=true
curseforge_server=true
# Comma-separated CurseForge project slugs.
curseforge_requires=
curseforge_optional=curios,accessories,cosmetic-armor-reworked,travelers-backpack,tool-belt,backpacked
# Mod slots read on Fabric (the other slot mods are NeoForge-only).
curseforge_optional_fabric=accessories
# The Fabric jar also needs Fabric API and Forge Config API Port.
curseforge_requires_fabric=fabric-api,forge-config-api-port
modrinth_requires_fabric=fabric-api,forge-config-api-port
